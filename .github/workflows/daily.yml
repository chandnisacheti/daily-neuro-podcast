name: Daily episode

on:
  schedule:
    # GitHub delays or drops busy top-of-hour schedules, so use odd minutes and a backup slot.
    # 09:17 UTC = 4:17 AM New York in winter; backup at 09:52. The backup skips if today's episode exists.
    - cron: "17 9 * * *"
    - cron: "52 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q feedparser requests edge-tts
      - name: Make episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: cd podcast && python make_episode.py
      - name: Publish
        run: |
          git config user.name "neuro-morning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Episode $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main && git push
