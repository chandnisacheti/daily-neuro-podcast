name: Daily episode

on:
  schedule:
    # 10:00 UTC = 5:00 AM New York in winter (6:00 AM in summer). Change to match wake-up time.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q feedparser requests edge-tts
      - name: Make episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd podcast && python make_episode.py
      - name: Publish
        run: |
          git config user.name "neuro-morning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Episode $(date -u +%F)" || echo "nothing to commit"
          git push
